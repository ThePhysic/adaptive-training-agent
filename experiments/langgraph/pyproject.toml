[project]
name = "future-training-langgraph-spike"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "langgraph==1.2.17",
  "langgraph-checkpoint-sqlite==3.1.2",
  "pydantic==2.14.1",
  "psycopg[binary]==3.3.6",
  "fastapi==0.162.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-socket==0.8.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["../../src", "."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --strict-markers --allow-hosts=127.0.0.1,::1 --basetemp=../../.cache/pytest-f203"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
