[project]
name = "future-training-langfuse-offline"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "langfuse==5.0.4",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-socket==0.8.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["../../src", "../../tests", "."]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider --strict-markers --disable-socket --basetemp=../../.cache/pytest-f305a-sdk"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
