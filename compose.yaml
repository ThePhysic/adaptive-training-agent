# Local synthetic development only. No app container or externally exposed database.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: training_dev
      POSTGRES_USER: training_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - training_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_dev -d training_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  training_pg:
