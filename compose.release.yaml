name: fata-release
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    network_mode: host
    command: ["postgres", "-p", "55432", "-c", "listen_addresses=127.0.0.1", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: training_dev
      POSTGRES_USER: training_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - release_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55432 -U training_dev -d training_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1
    logging: &logs
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
  app:
    image: ${FATA_RELEASE_IMAGE:-fata-release:f4-01}
    network_mode: host
    environment:
      FATA_RELEASE_ACK: local-synthetic-only
      FATA_LOCAL_DEV: "1"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: ["CMD", "python", "scripts/release.py", "ready"]
      interval: 3s
      timeout: 4s
      retries: 10
      start_period: 15s
    stop_grace_period: 40s
    logging: *logs
volumes:
  release_pg:
